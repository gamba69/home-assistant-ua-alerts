name: Project tests

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run regression suite
        run: pytest -q

      - name: Compile Python
        run: python -m compileall -q custom_components tests scripts

      - name: Validate JSON and YAML
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in {".git", ".pytest_cache", "__pycache__"} for part in path.parts):
                  continue
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif path.suffix in {".yaml", ".yml"}:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
          PY

      - name: Reject generated patch files
        shell: bash
        run: |
          if git ls-files '*.patch' | grep -q .; then
            echo 'Generated .patch files must not be committed.' >&2
            git ls-files '*.patch' >&2
            exit 1
          fi
